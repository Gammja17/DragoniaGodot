# main 에 올릴 때마다 Windows판(zip)을 내보내, 저장소의 Release "windows-latest" 에 갈아 끼운다.
# 받는 곳은 늘 같다: releases/latest/download/Dragonia-windows.zip
# 내보내기 틀(export templates, 1.2GB)은 여기 GitHub 서버에서만 받는다 (Windows 틀만 꺼내 쓰고, 다음부터는 캐시).
name: Windows판 내보내기 · Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Godot · Windows 내보내기 틀 캐시
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-windows

      - name: Godot 받기
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          base=https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable
          mkdir -p ~/godot && cd ~/godot
          wget -q $base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          unzip -q Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip && rm Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          wget -q $base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          dest=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p $dest
          unzip -q -j Godot_v${GODOT_VERSION}-stable_export_templates.tpz 'templates/version.txt' 'templates/windows_*' -d $dest
          rm Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          ls $dest

      - name: 내보내기
        run: |
          godot=~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64
          mkdir -p builds/windows
          $godot --headless --import
          $godot --headless --export-release "Windows" builds/windows/Dragonia.exe
          cd builds/windows && zip -q -9 ../Dragonia-windows.zip Dragonia.exe && ls -la ..

      - name: Release 에 올리기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse --short HEAD)
          notes="main ${sha} 에서 만든 Windows판입니다. 압축을 풀고 Dragonia.exe 를 실행합니다.
          서명이 없어서 처음 실행할 때 Windows 경고가 뜨면 [추가 정보] → [실행]을 누릅니다.
          세이브는 %APPDATA%\\Godot\\app_userdata\\Dragonia 에 남습니다 (웹판 세이브와는 따로입니다)."
          gh release delete windows-latest --yes --cleanup-tag || true
          gh release create windows-latest builds/Dragonia-windows.zip --title "최신 Windows판 (${sha})" --notes "$notes" --target "$GITHUB_SHA" --latest
